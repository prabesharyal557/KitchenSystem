services:
  - type: web
    name: sajilo-restaurant
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /tmp/sajilo-data
      - key: SECURE_COOKIE
        value: "1"
